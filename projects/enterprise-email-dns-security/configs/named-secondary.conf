// artifact: reference-implementation
// Excerpt for the secondary BIND server in the example outer namespace.
options {
    directory "/var/named";
    listen-on port 53 { 198.51.100.11; 127.0.0.1; };
    allow-query { any; };
    recursion no;
};
zone "example.org" IN {
    type slave;
    masters { 198.51.100.10; };
    file "slaves/example.org.zone";
};
zone "100.51.198.in-addr.arpa" IN {
    type slave;
    masters { 198.51.100.10; };
    file "slaves/100.51.198.in-addr.arpa.zone";
};
