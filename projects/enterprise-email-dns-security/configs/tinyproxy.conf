# artifact: reference-implementation
# Use explicit proxy configuration in a disconnected lab. Do not assume that
# a firewall port redirect alone makes arbitrary HTTP/HTTPS transparent.
Port 8888
Listen 172.24.25.20
Timeout 600
MaxClients 40
Allow 172.24.25.0/24
ConnectPort 443
ConnectPort 563
LogLevel Info
LogFile "/var/log/tinyproxy/tinyproxy.log"
# Add further client subnets only after a specific firewall and proxy ACL review.
