// artifact: reference-implementation
// Excerpt for an isolated BIND authoritative server, not a complete named.conf.
options {
    directory "/var/named";
    listen-on port 53 { 198.51.100.10; 127.0.0.1; };
    allow-query { any; };
    recursion no;
};
zone "example.org" IN {
    type master;
    file "example.org.zone";
    allow-transfer { 198.51.100.11; };
    // BIND 9.20.2 reference: automatic key generation and inline signing.
    // Create the private key-directory on the server; never put it in Git.
    dnssec-policy default;
    inline-signing yes;
    key-directory "/var/named/keys";
};
zone "100.51.198.in-addr.arpa" IN {
    type master;
    file "100.51.198.in-addr.arpa.zone";
    allow-transfer { 198.51.100.11; };
};
