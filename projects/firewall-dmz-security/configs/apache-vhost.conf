# artifact: reference-implementation
# Example HTTP vhost for either isolated DMZ server.
<VirtualHost *:80>
    ServerName dmz.example.test
    DocumentRoot /var/www/html
    ErrorLog /var/log/httpd/dmz-error.log
    CustomLog /var/log/httpd/dmz-access.log combined
    <Directory /var/www/html>
        Require all granted
    </Directory>
</VirtualHost>
