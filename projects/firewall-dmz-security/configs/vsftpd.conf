# artifact: reference-implementation
# VyOS DMZ reference. The report establishes vsftpd service use but not a range.
listen=YES
anonymous_enable=NO
local_enable=YES
write_enable=NO
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30100
# Routed isolated public segment: advertise the server's reachable DMZ address.
pasv_address=172.18.37.10
# Chroot and home-directory ownership depend on the installed vsftpd release.
chroot_local_user=YES
