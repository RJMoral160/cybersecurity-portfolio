# artifact: reference-implementation
# VyOS 1.5-style command excerpt adapted from the recorded rule numbers.
# eth0=private B, eth1=DMZ, eth2=isolated public test network.
set interfaces ethernet eth0 address '192.168.2.1/24'
set interfaces ethernet eth1 address '172.18.37.1/24'
set interfaces ethernet eth2 address '203.0.113.4/24'
set firewall ipv4 forward filter default-action 'drop'
set firewall ipv4 forward filter default-log
set firewall ipv4 forward filter rule 10 action 'accept'
set firewall ipv4 forward filter rule 10 state 'established'
set firewall ipv4 forward filter rule 10 state 'related'
set firewall ipv4 forward filter rule 20 action 'drop'
set firewall ipv4 forward filter rule 20 state 'invalid'
set firewall ipv4 forward filter rule 30 action 'accept'
set firewall ipv4 forward filter rule 30 inbound-interface name 'eth0'
set firewall ipv4 forward filter rule 30 outbound-interface name 'eth1'
set firewall ipv4 forward filter rule 30 source address '192.168.2.0/24'
set firewall ipv4 forward filter rule 30 destination address '172.18.37.10'
set firewall ipv4 forward filter rule 30 destination port '21,80'
set firewall ipv4 forward filter rule 30 protocol 'tcp'
# Reference: explicit private-client passive data permit, independent of FTP helper.
set firewall ipv4 forward filter rule 35 action 'accept'
set firewall ipv4 forward filter rule 35 inbound-interface name 'eth0'
set firewall ipv4 forward filter rule 35 outbound-interface name 'eth1'
set firewall ipv4 forward filter rule 35 source address '192.168.2.0/24'
set firewall ipv4 forward filter rule 35 destination address '172.18.37.10'
set firewall ipv4 forward filter rule 35 destination port '30000-30100'
set firewall ipv4 forward filter rule 35 protocol 'tcp'
set firewall ipv4 forward filter rule 40 action 'accept'
set firewall ipv4 forward filter rule 40 inbound-interface name 'eth2'
set firewall ipv4 forward filter rule 40 outbound-interface name 'eth1'
set firewall ipv4 forward filter rule 40 destination address '172.18.37.10'
set firewall ipv4 forward filter rule 40 destination port '21,80'
set firewall ipv4 forward filter rule 40 protocol 'tcp'
# Rule 45 is a reference passive FTP addition; the source report does not record its range.
set firewall ipv4 forward filter rule 45 action 'accept'
set firewall ipv4 forward filter rule 45 inbound-interface name 'eth2'
set firewall ipv4 forward filter rule 45 outbound-interface name 'eth1'
set firewall ipv4 forward filter rule 45 destination address '172.18.37.10'
set firewall ipv4 forward filter rule 45 destination port '30000-30100'
set firewall ipv4 forward filter rule 45 protocol 'tcp'
set firewall ipv4 forward filter rule 50 action 'accept'
set firewall ipv4 forward filter rule 50 inbound-interface name 'eth2'
set firewall ipv4 forward filter rule 50 outbound-interface name 'eth1'
set firewall ipv4 forward filter rule 50 destination address '172.18.37.10'
set firewall ipv4 forward filter rule 50 destination port '69'
set firewall ipv4 forward filter rule 50 protocol 'udp'
# Private B egress was an objective in the report but the forward default-drop
# excerpt lacks this permit. Limit new flows to isolated upstream DNS/HTTP(S).
set firewall ipv4 forward filter rule 70 action 'accept'
set firewall ipv4 forward filter rule 70 inbound-interface name 'eth0'
set firewall ipv4 forward filter rule 70 outbound-interface name 'eth2'
set firewall ipv4 forward filter rule 70 source address '192.168.2.0/24'
set firewall ipv4 forward filter rule 70 destination address '203.0.113.20'
set firewall ipv4 forward filter rule 70 destination port '80,443'
set firewall ipv4 forward filter rule 70 protocol 'tcp'
set firewall ipv4 forward filter rule 71 action 'accept'
set firewall ipv4 forward filter rule 71 inbound-interface name 'eth0'
set firewall ipv4 forward filter rule 71 outbound-interface name 'eth2'
set firewall ipv4 forward filter rule 71 source address '192.168.2.0/24'
set firewall ipv4 forward filter rule 71 destination address '203.0.113.20'
set firewall ipv4 forward filter rule 71 destination port '53'
set firewall ipv4 forward filter rule 71 protocol 'tcp_udp'
# Router-local traffic is distinct from forwarded DMZ traffic. Reference management
# host 192.168.2.20 only; allow DHCP/DNS elsewhere only after a separate design.
set firewall ipv4 input filter default-action 'drop'
set firewall ipv4 input filter default-log
set firewall ipv4 input filter rule 10 action 'accept'
set firewall ipv4 input filter rule 10 state 'established'
set firewall ipv4 input filter rule 10 state 'related'
set firewall ipv4 input filter rule 20 action 'drop'
set firewall ipv4 input filter rule 20 state 'invalid'
set firewall ipv4 input filter rule 30 action 'accept'
set firewall ipv4 input filter rule 30 inbound-interface name 'eth0'
set firewall ipv4 input filter rule 30 source address '192.168.2.20'
set firewall ipv4 input filter rule 30 destination port '22'
set firewall ipv4 input filter rule 30 protocol 'tcp'
# IPv6 is out of scope for the isolated IPv4 lab. If enabled, prevent an
# unfiltered parallel path; add required ICMPv6/management rules before use.
set firewall ipv6 forward filter default-action 'drop'
set firewall ipv6 input filter default-action 'drop'
set nat source rule 100 outbound-interface name 'eth2'
set nat source rule 100 source address '192.168.2.0/24'
set nat source rule 100 translation address 'masquerade'
set protocols static route 0.0.0.0/0 next-hop '203.0.113.1'
set system conntrack modules 'tftp'
# In a routed isolated lab, upstream must route 172.18.37.0/24 via 203.0.113.4.
# The source report's rule 30 had a destination matching the private subnet;
# this reference matches the DMZ host instead. Validate on the installed VyOS release.
