# artifact: reference-implementation
# Alternative to the historical wlan0/PHY requirement in a VM.
# eth0 remains VLAN-172 untagged transit; eth1 is an isolated wired client LAN.
set interfaces ethernet eth0 address '172.30.12.130/25'
set interfaces ethernet eth1 address '172.30.12.1/25'
set protocols ospf area 0 network '172.30.12.128/25'
set protocols ospf area 0 network '172.30.12.0/25'
set service dhcp-server listen-interface 'eth1'
set service dhcp-server shared-network-name 'WIRED_CLIENTS' subnet '172.30.12.0/25' option default-router '172.30.12.1'
set service dhcp-server shared-network-name 'WIRED_CLIENTS' subnet '172.30.12.0/25' option name-server '10.2.12.53'
set service dhcp-server shared-network-name 'WIRED_CLIENTS' subnet '172.30.12.0/25' range 1 start '172.30.12.2'
set service dhcp-server shared-network-name 'WIRED_CLIENTS' subnet '172.30.12.0/25' range 1 stop '172.30.12.102'
# No radio association or WPA2 security is provided by this alternative.
