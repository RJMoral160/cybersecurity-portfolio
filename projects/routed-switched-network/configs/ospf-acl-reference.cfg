! artifact: reference-implementation
! New policy design for isolated retest; not the original ACL or a claim of
! historical validation. Apply on router 1's intended inside interface and
! test counters before relying on the restriction.
ip access-list extended WIRELESS_TFTP_REFERENCE
 permit udp 172.30.12.0 0.0.0.127 host 10.1.112.10 eq 69
 deny udp any host 10.1.112.10 eq 69 log
 permit ip any any
! The historical TFTP permit used 172.30.12.0 0.0.0.255, a /24.
! Wireless clients occupy only 172.30.12.0/25. This reference narrows
! the source and fixes the destination to a hypothetical local TFTP host.
